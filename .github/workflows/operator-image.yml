# Builds the perf-experiment operator image. Nothing else.
#
# This repository is a fork of hapifhir/hapi-fhir and the Java project's own
# CI was removed with it -- there is no Maven build here, no test run, and no
# release. The path filter below is what keeps it that way: a commit that does
# not touch perf-experiment/operator does not start this workflow.
#
# The cluster this image runs on is single-node k3s on linux/amd64, so that is
# the only platform built. Adding arm64 would double the build for a node that
# will never pull it.
name: operator image

on:
  push:
    branches: [master]
    paths:
      - 'perf-experiment/operator/**'
      - '.github/workflows/operator-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fhir-operator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: perf-experiment/operator
          platforms: linux/amd64
          push: true
          # The commit sha is the tag that matters. A benchmark result has to
          # be able to name the operator that produced it, and `latest` cannot
          # do that. `latest` is here for convenience only.
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        run: |
          {
            echo "### Operator image"
            echo
            echo '```'
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Deploy the immutable reference:"
            echo
            echo '```sh'
            echo "kubectl -n fhir-operator set image deploy/fhir-operator \\"
            echo "  operator=${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
