# Created by claude-opus-5
#
# Builds the two images the operator needs, worker first.
#
# The operator is built with the worker's *digest* as a build arg, so a
# deployed operator can only ever launch the worker it was built alongside.
# Nothing resolves a floating tag at run time, and no source is shipped to a
# pod in a ConfigMap.
#
# No GCP credentials are needed here. The operator obtains its own at run time
# by impersonating the writer service account.

name: operator image

on:
  push:
    branches: [master]
    paths:
      - 'perf-experiment/operator/**'
      - '.github/workflows/operator-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/fhir-operator
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/fhir-worker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Worker first: its digest is an input to the operator build.
      - id: worker
        name: build worker
        uses: docker/build-push-action@v6
        with:
          context: perf-experiment/operator
          target: worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:sha-${{ github.sha }}
            ${{ env.WORKER_IMAGE }}:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - id: build
        name: build operator
        uses: docker/build-push-action@v6
        with:
          context: perf-experiment/operator
          target: operator
          platforms: linux/amd64
          push: true
          build-args: |
            WORKER_IMAGE=${{ env.WORKER_IMAGE }}@${{ steps.worker.outputs.digest }}
          tags: |
            ${{ env.OPERATOR_IMAGE }}:sha-${{ github.sha }}
            ${{ env.OPERATOR_IMAGE }}:latest
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

      - name: summary
        run: |
          {
            echo "### Operator image"
            echo
            echo '```'
            echo "${OPERATOR_IMAGE}:sha-${GITHUB_SHA}"
            echo "${OPERATOR_IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Workers it will launch, pinned into the operator at build time:"
            echo
            echo '```'
            echo "${WORKER_IMAGE}@${WORKER_DIGEST}"
            echo '```'
            echo
            echo "Deploy the immutable reference:"
            echo
            echo '```sh'
            echo "kubectl -n fhir-operator set image deploy/fhir-operator \\"
            echo "  operator=${OPERATOR_IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
