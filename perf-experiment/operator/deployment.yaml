apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-operator
  namespace: fhir-operator
spec:
  # One replica on purpose. The operator runs --standalone, so it does no
  # peering; two replicas would both drive the same FhirStack.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: fhir-operator}
  template:
    metadata:
      labels: {app: fhir-operator}
    spec:
      serviceAccountName: fhir-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          # Substituted by deploy.sh with ghcr.io/<owner>/fhir-operator:sha-<commit>.
          # Pinned to a commit rather than :latest on purpose -- a benchmark
          # result has to be able to name the operator that produced it, and a
          # floating tag cannot. This file is not applied directly; deploy.sh
          # is the entry point.
          image: __OPERATOR_IMAGE__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Command and dependencies come from the image. Nothing is installed
          # at startup, so there is no PyPI egress to have and nothing racing
          # the liveness probe.
          env:
            - {name: HOME, value: /tmp}
            # The stack manifest is the one input that is not in the image: it
            # lives in the mimic-fhir-downloader repo and deploy.sh reads it
            # off disk into a ConfigMap. Same path as the local container, so
            # there is one layout to reason about.
            - {name: FHIR_MANIFEST, value: /manifests/hapi-fhir-standalone.yaml}
            # kopf derives its identity from getpass.getuser(), which raises
            # KeyError for uid 65532 because the slim image has no passwd
            # entry for it. POD_ID is checked first and skips that path.
            - name: POD_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: USER, value: fhir-operator}
          # Same ports the image exposes and the local container uses, so
          # http://localhost:8085 is the UI whether you are port-forwarding
          # this or running docker-compose.
          ports:
            - {name: http, containerPort: 8086}       # kopf liveness
            - {name: ui, containerPort: 8085}         # flask UI
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: ui}
            periodSeconds: 10
          # The reconciler is up before either probe is allowed to judge it.
          # Liveness must never race startup: killing a pod that is still
          # booting produces a crash loop that looks like a broken operator.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: manifests, mountPath: /manifests, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: manifests
          configMap: {name: fhir-operator-manifest}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: fhir-operator
  namespace: fhir-operator
spec:
  selector: {app: fhir-operator}
  ports:
    - {name: ui, port: 8085, targetPort: ui}
