apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-operator
  namespace: fhir-operator
spec:
  # One replica on purpose. The operator runs --standalone, so it does no
  # peering; two replicas would both drive the same FhirStack.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: fhir-operator}
  template:
    metadata:
      labels: {app: fhir-operator}
    spec:
      serviceAccountName: fhir-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: python:3.12-slim
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # No image to build or push: dependencies are installed into an
          # emptyDir at startup. Costs ~20s per restart and needs egress to
          # PyPI. Swap for a prebuilt image if either becomes a problem.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --quiet --no-cache-dir --target /deps -r /app/requirements.txt
              exec kopf run /app/fhir_operator.py \
                --all-namespaces \
                --standalone \
                --liveness=http://0.0.0.0:8080/healthz \
                --verbose
          env:
            - {name: PYTHONPATH, value: /deps}
            - {name: PATH, value: "/deps/bin:/usr/local/bin:/usr/bin:/bin"}
            - {name: HOME, value: /tmp}
            - {name: FHIR_MANIFEST, value: /app/hapi-fhir-standalone.yaml}
            # kopf derives its identity from getpass.getuser(), which raises
            # KeyError for uid 65532 because the slim image has no passwd
            # entry for it. POD_ID is checked first and skips that path.
            - name: POD_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: USER, value: fhir-operator}
          ports:
            - {name: http, containerPort: 8080}       # kopf liveness
            - {name: ui, containerPort: 8090}         # flask UI
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: ui}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: deps, mountPath: /deps}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: app
          configMap: {name: fhir-operator-src}
        - {name: deps, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: fhir-operator
  namespace: fhir-operator
spec:
  selector: {app: fhir-operator}
  ports:
    - {name: ui, port: 8090, targetPort: ui}
