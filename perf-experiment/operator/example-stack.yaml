# CPU is cores, memory is GiB. Omit a block and the operator's defaults apply.
apiVersion: perf.pkb/v1alpha1
kind: FhirStack
metadata:
  name: perf-s
  namespace: perf-s
spec:
  cpuLimitPolicy: burst
  resources:
    hapi:
      cpu: {min: 1, max: 2}
      memory: {min: 2, max: 8}
    postgres:
      cpu: {min: 4, max: 8}
      memory: {min: 16, max: 16}
    elasticsearch:
      cpu: {min: 2, max: 4}
      memory: {min: 6, max: 6}
