apiVersion: v1
kind: ServiceAccount
metadata:
  name: fhir-operator
  namespace: fhir-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fhir-operator
rules:
  # kopf itself: progress events, resource discovery, namespace watching.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  # create is for the UI: a FhirStack needs its namespace to exist first.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create]

  # Every CRD in the group, not just fhirstacks: the UI discovers kinds at
  # request time, so a CRD added later must work without an RBAC change. The
  # wildcard covers the /status and /finalizers subresources too.
  - apiGroups: [perf.fhir]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]

  # The stack it renders. Deleting a FhirStack garbage-collects these via
  # owner references, so delete is not strictly required — it is here so a
  # half-applied stack can be cleaned up by hand.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, configmaps, secrets, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]

  # The operator creates the Role and RoleBinding that let Prometheus discover
  # loader pods. Granting rbac verbs needs the permissions being granted, or
  # the API server refuses with a privilege-escalation error.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # pods/log is the UI's live tail; events are what it falls back to for a pod
  # that never started and so has no log at all. Both are read-only.
  - apiGroups: [""]
    resources: [pods, pods/log, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fhir-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fhir-operator
subjects:
  - kind: ServiceAccount
    name: fhir-operator
    namespace: fhir-operator
